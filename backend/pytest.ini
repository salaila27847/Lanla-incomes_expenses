[pytest]
testpaths = tests

# `tests/` has no __init__.py, so pytest puts *that* directory on sys.path
# rather than this one, and `import app` fails. `python -m pytest` happened
# to work only because running a module as a script adds the working
# directory too. Making it explicit means the documented bare `pytest` works
# the same way CI runs it.
pythonpath = .
